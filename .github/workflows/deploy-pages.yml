name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js for Wrangler
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Pages Functions Worker
        run: npx --yes wrangler@4.145.0 pages functions build functions --outfile public/_worker.js --project-directory . --build-output-directory public --output-routes-path public/_routes.json

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=romaji-line-translator
          wranglerVersion: 4.145.0
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
